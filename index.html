<script id="app">
// ===== Scheduling engine (CPM, P6 conventions) =====
const DAYMS = 86400000;
function d2n(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAYMS); }
function n2d(n) { const t = new Date(n * DAYMS); return t.toISOString().slice(0, 10); }

function buildCalendar(cal, fromISO, toISO) {
  const hol = new Set(cal.holidays.map(h => h.d));
  const a = d2n(fromISO), b = d2n(toISO);
  const W = [];                 // workday numbers
  const firstIdx = new Map();   // daynum -> index of first workday >= day
  for (let n = a; n <= b; n++) {
    const dow = new Date(n * DAYMS).getUTCDay();
    if (cal.work[dow] && !hol.has(n2d(n))) W.push(n);
  }
  let k = 0;
  for (let n = a; n <= b; n++) { while (k < W.length && W[k] < n) k++; firstIdx.set(n, k); }
  const lo = a, hi = b;
  return {
    W,
    // boundary index at START of the first workday on/after date
    s(iso) { let n = d2n(iso); n = Math.max(lo, Math.min(hi, n)); return firstIdx.get(n); },
    // boundary index at END of the last workday on/before date
    f(iso) { let n = d2n(iso) + 1; n = Math.max(lo, Math.min(hi, n)); return firstIdx.get(n); },
    sd(t) { return n2d(W[Math.max(0, Math.min(W.length - 1, t))]); },          // start date of boundary t
    fd(t) { return n2d(W[Math.max(0, Math.min(W.length - 1, t - 1))]); },      // finish date of boundary t
    isWork(n) { const i = firstIdx.get(n); return i !== undefined && W[i] === n; }
  };
}

function isMile(a) { return a.type === 'TT_Mile' || a.type === 'TT_FinMile'; }
function isDone(a) { return isMile(a) ? (a.pct >= 1 && !!(a.as_ || a.af)) : !!a.af; }
function isStarted(a) { return !!a.as_ || (isMile(a) && a.pct >= 1); }
function remDur(a) { return isMile(a) ? 0 : isDone(a) ? 0 : Math.max(0, +a.rd || 0); }

function schedule(P) {
  const t0 = Date.now();
  const cal = buildCalendar(P.calendar, '2024-01-01', '2032-12-31');
  const dd = cal.s(P.dataDate);
  const acts = P.activities, byId = new Map(acts.map(a => [a.id, a]));
  const preds = new Map(), succs = new Map();
  acts.forEach(a => { preds.set(a.id, []); succs.set(a.id, []); });
  const badRels = [];
  P.rels.forEach(r => { r._c = undefined; r._driving = false; });
  P.rels.forEach(r => {
    if (!byId.has(r.pred) || !byId.has(r.succ) || r.pred === r.succ) { badRels.push(r); return; }
    preds.get(r.succ).push(r); succs.get(r.pred).push(r);
  });
  // topological order (Kahn)
  const indeg = new Map(acts.map(a => [a.id, preds.get(a.id).length]));
  const q = acts.filter(a => indeg.get(a.id) === 0).map(a => a.id), order = [];
  while (q.length) { const id = q.shift(); order.push(id); succs.get(id).forEach(r => { indeg.set(r.succ, indeg.get(r.succ) - 1); if (indeg.get(r.succ) === 0) q.push(r.succ); }); }
  const loopIds = acts.filter(a => !order.includes(a.id)).map(a => a.id);
  const S = new Map(); // computed results

      else { o.es = cal.s(a.as_ || a.af); o.ef = Math.max(o.es + 1, cal.f(a.af)); o.rs = o.ef; }
      o.done = true;
    } else {
      let start = dd, why = null;
      const started = !!a.as_ && !isMile(a);
      for (const r of preds.get(id)) {
        const p = S.get(r.pred); if (!p) continue; const lag = +r.lag || 0; let c;
        if (r.type === 'SS') { if (started) continue; c = p.es + lag; }
        else if (r.type === 'FF') c = p.ef + lag - dur;
        else if (r.type === 'SF') c = (started ? p.rs : p.es) + lag - dur;
        else c = p.ef + lag;
        if (c > start) { start = c; why = r; } else if (c === start && why) { /* tie */ }
        r._c = c;
      }

        if (ct === 'SNET' && cal.s(cd) > start) { start = cal.s(cd); why = 'cons'; }
        if (ct === 'FNET' && cal.f(cd) - dur > start) { start = cal.f(cd) - dur; why = 'cons'; }
      }
      o.rs = start; o.ef = start + dur;
      o.es = started ? cal.s(a.as_) : start;
      o.drvStart = start;
    }

    const o = S.get(id), a = byId.get(id);
    preds.get(id).forEach(r => { r._driving = !o.done && r._c !== undefined && r._c === o.drvStart && o.drvStart > dd; });

          const rem = pool.reduce((s, a) => s + a.weight * (1 - p.get(a.id)), 0); const take = Math.min(delta, rem);
          pool.forEach(a => p.set(a.id, p.get(a.id) + take * (a.weight * (1 - p.get(a.id))) / rem / a.weight));
          delta -= take; pool = pool.filter(a => p.get(a.id) < 0.99995); if (delta > 1e-12) pool = [];
        }
      } else {
        const pool = bld.filter(a => p.get(a.id) > 0 && p.get(a.id) < 1); const ear = pool.reduce((s, a) => s + a.weight * p.get(a.id), 0);
        if (ear > 0) pool.forEach(a => p.set(a.id, Math.max(0, p.get(a.id) * (1 + delta / ear))));
      }
      bld.forEach(a => { const nv = p.get(a.id); if (Math.abs(nv - (+a.pct || 0)) > 1e-4) push(a, nv, B.inc, 'split of 1C3-1 estimated – file has the building total only'); });
      warn.push(`GIS building 1C3-1: file gives the total only (${(cur * 100).toFixed(2)}% → ${(B.pct * 100).toFixed(2)}%). The change was spread over the building activities in progress in proportion to their remaining work – correct them if the site split is different.`);
    }
  }
  if (newDD < prevDD) warn.push(`Status date ${fmtD(T.status)} is earlier than the current data date ${fmtD(prevDD)} – this goes back in time`);
  const after = new Map(changes.map(x => [x.a.id, x.n]));
  const ev = P.activities.reduce((s, a) => { const n = after.get(a.id); return s + (+a.weight || 0) * (n ? n.pct : (+a.pct || 0)); }, 0);
  return { changes, warn, newDD, ev };
}

function planImport(T) {
  const changes = [], warn = [], used = new Set(), claimed = new Set();
  const newDD = addDays(T.status, 1);
  const acts = [...P.activities].sort((a, b) => a.seq - b.seq);
  acts.forEach(a => {
    let t = a.trk;
    if (t === false || isMile(a)) return;
    if (!t) { const codes = (a.boq || '').split(',').map(s => s.trim()).filter(Boolean); if (!codes.length) return; t = { c: codes }; }
    const sel = T.rows.filter(r => t.c.includes(r.wbs) && (!t.s || t.s.includes(r.step)) && (!t.g || t.g.some(p => String(r.sub).includes(p))) && !used.has(r.id));
    if (t.g) sel.forEach(r => used.add(r.id));
    if (!sel.length) { if (a.trk) warn.push(`${a.id}: no matching rows in the tracker for ${t.c.join(', ')}`); return; }
    sel.forEach(r => claimed.add(r.id));
    const U = sel.reduce((s, r) => s + r.U, 0), V = sel.reduce((s, r) => s + r.V, 0);
    let pct = U > 0 ? V / U : sel.reduce((s, r) => s + (+r.pct || 0), 0) / sel.length;
    pct = Math.round(Math.min(1, Math.max(0, pct)) * 10000) / 10000; if (pct > 0.9999) pct = 1;
    const value = Math.round(sel.reduce((s, r) => s + r.K * r.val, 0) * 100) / 100;
    let first = null, last = null;
    sel.forEach(r => { const o = T.logs.get(r.id); if (o) { if (!first || o.first < first) first = o.first; if (!last || o.last > last) last = o.last; } if (r.last && (!last || r.last > last) && r.last <= T.status && (!T.cutover || r.last > T.cutover)) last = r.last; });
    const n = { pct, as_: a.as_, af: a.af, rd: a.rd, weight: U, value };
    const notes = [];
    if (pct > 0 && !a.as_) { n.as_ = first || T.status; notes.push(first ? 'start from DAILY_LOG' : 'start = status date (no log line)'); }
    if (pct >= 1) { n.af = a.af || last || T.status; n.rd = 0; if (!a.af) notes.push(last ? 'finish from DAILY_LOG' : 'finish = status date'); }
    else {
      if (a.af) { n.af = null; notes.push('re-opened (tracker < 100%)'); }
      if (pct > 0 && (Math.abs(pct - a.pct) > 1e-4 || a.af)) n.rd = Math.max(1, Math.round((+a.od || 1) * (1 - pct)));
      if (pct === 0 && a.pct > 0) notes.push('progress dropped to 0% – check');
    }
    if (pct < a.pct - 1e-4 && pct > 0) notes.push('progress decreased – check');
    if (n.as_ && n.as_ > T.status) n.as_ = T.status;
    if (n.af && n.as_ && n.af < n.as_) n.af = n.as_;
    const wChg = Math.abs(U - (+a.weight || 0)) > 1e-9 || Math.abs(value - (+a.value || 0)) > 0.5;
    const prog = Math.abs(pct - (+a.pct || 0)) > 1e-4 || n.as_ !== a.as_ || n.af !== a.af;
    if (prog || wChg) changes.push({ a, n, prog, wChg, notes });
  });
  const orphan = T.rows.filter(r => r.V > 0 && !claimed.has(r.id));
  if (orphan.length) { const codes = [...new Set(orphan.map(r => r.wbs))]; warn.push(`Progress in the tracker not linked to any activity: ${codes.join(', ')} – add an activity with that BOQ code`); }
  const bad = P.activities.filter(a => (a.as_ && a.as_ >= newDD && !isMile(a)) || (a.af && a.af >= newDD));
  if (bad.length) warn.push(`Actual dates on/after the new data date: ${bad.map(a => a.id).join(', ')}`);
  if (newDD < P.dataDate) warn.push(`Status date ${fmtD(T.status)} is earlier than the current data date ${fmtD(P.dataDate)} – this goes back in time`);
  // reconciliation
  const after = new Map(changes.map(x => [x.a.id, x.n]));
  const ev = P.activities.reduce((s, a) => { const n = after.get(a.id); return s + (n ? n.weight * n.pct : (+a.weight || 0) * (+a.pct || 0)); }, 0);
  return { changes, warn, newDD, ev };
}

function importDialog(T, plan, fname) {
  const { changes, warn, newDD, ev } = plan;
  const rec = T.total === null ? '' : `<tr><td>Overall actual – file</td><td class="n"><b>${(T.total * 100).toFixed(2)}%</b></td></tr><tr><td>Overall actual – schedule after import</td><td class="n"><b style="color:${Math.abs(ev - T.total) > 0.0005 ? 'var(--bad)' : 'var(--ok)'}">${(ev * 100).toFixed(2)}%</b></td></tr>`;
  const prog = changes.filter(x => x.prog), wOnly = changes.filter(x => !x.prog);
  const rowsHtml = prog.map((x, i) => {
    const a = x.a, n = x.n, ip = n.pct > 0 && n.pct < 1;
    return `<tr><td>${esc(a.id)}</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${esc(a.name)}">${esc(a.name)}</td>
      <td class="n">${(a.pct * 100).toFixed(1)} → <b>${(n.pct * 100).toFixed(1)}%</b></td><td>${fmtD(n.as_)}${n.as_ !== a.as_ ? ' •' : ''}</td><td>${fmtD(n.af)}${n.af !== a.af ? ' •' : ''}</td>
      <td>${ip ? `<input data-imrd="${i}" value="${n.rd}" size="3" inputmode="numeric" aria-label="Remaining duration ${esc(a.id)}">` : n.pct >= 1 ? '0' : esc(n.rd)}</td>
      <td class="hint">${esc(x.notes.join('; '))}</td></tr>`;
  }).join('');
  dlg(`<h2>Import from tracker</h2>
   <table class="mini" style="max-width:520px"><tr><td>File</td><td class="n">${esc(fname)}</td></tr><tr><td>Format</td><td class="n">${T.kind === 'legacy' ? 'EGAT monthly S-curve (' + esc(T.sheet) + ')' : 'Integrated Progress Tracker'}</td></tr><tr><td>Status date</td><td class="n">${fmtD(T.status)}</td></tr>
   <tr><td>Data date</td><td class="n">${fmtD(P.dataDate)} → <b>${fmtD(newDD)}</b></td></tr>${T.nLog === null ? '' : `<tr><td>DAILY_LOG lines counted</td><td class="n">${T.nLog}</td></tr>`}${rec}</table>
   ${warn.length ? `<h3 style="color:var(--warn)">Check</h3><ul style="margin:0;padding-left:18px">${warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
   <h3>Progress changes (${prog.length})</h3>
   ${prog.length ? `<div class="scrollx"><table class="mini" style="max-width:none"><tr><th>ID</th><th>Activity</th><th class="n">% complete</th><th>Actual start</th><th>Actual finish</th><th>Rem. dur (d)</th><th>Note</th></tr>${rowsHtml}</table></div>
   <p class="hint">• = date filled in by the import${T.kind === 'legacy' ? ' (this file has monthly figures only, so new start/finish dates are estimates – edit them in the Status tab if you know the real dates)' : ''}. Remaining duration of in-progress work is estimated from % remaining × original duration – overwrite it with the site's estimate.</p>` : '<p class="hint">No progress changed since the last update. The data date will still move.</p>'}
   ${wOnly.length ? `<p class="hint">Weight / contract value refreshed for ${wOnly.length} more activit${wOnly.length > 1 ? 'ies' : 'y'} (BOQ change in the tracker).</p>` : ''}
   <div class="act"><button class="btn" data-close>Cancel</button><button class="btn primary" id="imGo">Apply update</button></div>`);
  $('#dlg').classList.add('wide');
  $('#imGo').onclick = () => {
    for (const inp of document.querySelectorAll('#dlg [data-imrd]')) { const v = parseInt(inp.value, 10); if (isNaN(v) || v < 1) { toast('Remaining duration must be a whole number ≥ 1'); inp.focus(); return; } prog[+inp.dataset.imrd].n.rd = v; }
    pushUndo('import tracker');
    changes.forEach(({ a, n }) => { a.pct = n.pct; a.as_ = n.as_ || null; a.af = n.af || null; a.rd = n.rd; a.weight = n.weight; a.value = n.value; });
    P.dataDate = newDD;
    P.log.unshift(`Imported ${fname} ${new Date().toLocaleString('en-GB')}\nStatus date ${fmtD(T.status)} → data date ${fmtD(newDD)}\n${prog.length} activities with new progress, ${wOnly.length} weight/value refreshes\nTracker overall ${T.total === null ? '–' : (T.total * 100).toFixed(2) + '%'} · schedule ${(ev * 100).toFixed(2)}%${warn.length ? '\nChecks:\n  ' + warn.join('\n  ') : ''}`);
    closeDlg(); $('#dlg').classList.remove('wide'); recalc(true);
    toast(`Updated ${prog.length} activities · data date ${fmtD(newDD)} · review, then Publish changes`, 5000);
  };
}

async function importTracker(file) {
  if (!canEdit() || !file) return;
  toast('Reading ' + file.name + '…', 8000);
  try {
    const [XLSX, buf] = await Promise.all([loadXLSX(), file.arrayBuffer()]);
    const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
    let T;
    if (wb.SheetNames.includes('ACTIVITIES') && wb.SheetNames.includes('CONTROL')) {
      const M = readMaster(XLSX, wb); $('#toast').hidden = true; masterDialog(M, file.name); return;
    }
    if (wb.SheetNames.includes('ACTIVITY') && wb.SheetNames.includes('CONTROL')) T = readTracker(XLSX, wb);
    else if (wb.SheetNames.some(n => n.trim() === 'Progress Actual Work%')) T = readLegacy(XLSX, wb);
    else throw new Error('Not a recognised file – use the schedule master, the Integrated Progress Tracker or the EGAT monthly S-curve file');
    const plan = T.kind === 'legacy' ? planLegacy(T) : planImport(T);
    $('#toast').hidden = true;
    importDialog(T, plan, file.name);
  } catch (e) { toast('Import failed: ' + (e && e.message || e), 6000); }
}

async function exportMaster() {
  if (!canEdit()) return;
  if (PRIV_MISSING) { toast('Import your master file on this device first (Restore private data) – otherwise the export would have no contract values, rates or notes', 6000); return; }
  try {
    const XLSX = await loadXLSX();
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl) { toast('Saving files is not available in this view – open the schedule on claude.ai', 4500); return; }
    R = schedule(P);
    const buf = XLSX.write(buildMasterWB(XLSX, P, R), { bookType: 'xlsx', type: 'array' });
    const fn = `NSR4239_Schedule_Master_${n2d(d2n(P.dataDate) - 1)}.xlsx`;
    await dl.save({ filename: fn, data: new Blob([buf]) });
    toast(`Saved ${fn} – keep it as your master file`, 4500);
  } catch (e) {
    const c = e && e.code;
    if (c === 'declined') toast('Export cancelled');
    else if (c === 'rate_limited') toast('A save prompt is already open – finish it first');
    else toast('Export failed: ' + (e && e.message || c || e), 5000);
  }
}

// ---------- read & validate ----------
function readMaster(XLSX, wb) {

  const date = (v, where) => { if (v === null || v === undefined || v === '') return null; const d = serIso(v); if (!d) errs.push(`${where}: date "${v}" not recognised`); return d; };
  const num = (v, where, dflt = 0) => { if (v === null || v === undefined || v === '') return dflt; const x = Number(String(v).replace(/,/g, '')); if (isNaN(x)) { errs.push(`${where}: "${v}" is not a number`); return dflt; } return x; };
  // CONTROL
  const C = G('CONTROL'); const cv = lab => { const r = C.find(r => r && str(r[0]) === lab); return r ? r[1] : undefined; };
  const status = date(cv('STATUS DATE (progress as of)'), 'CONTROL STATUS DATE');
  if (!status) errs.push('CONTROL: STATUS DATE is empty');
  const dataDate = status ? n2d(d2n(status) + 1) : P.dataDate;
  const NP = {
    name: str(cv('Project name')) || P.name, code: str(cv('Project code')) || P.code, client: str(cv('Client')) || P.client, contractor: str(cv('Contractor')) || P.contractor, contract: str(cv('Contract No.')) || P.contract,
    dataDate, start: date(cv('Project start'), 'CONTROL Project start') || P.start, mustFinish: date(cv('Must finish by'), 'CONTROL Must finish by'),
    critical: { mode: /longest/i.test(str(cv('Critical activities'))) ? 'lp' : 'tf', tf: num(cv('Critical if total float ≤ (days)'), 'CONTROL critical float', 0) },
    activeBaseline: str(cv('Active baseline ID')), log: P.log, rev: P.rev, publishedAt: P.publishedAt,
  };
  // WBS
  const W = tbl('WBS', 'WBS ID'); NP.wbs = W.rows.map(({ r }) => ({ id: str(r[0]), code: str(r[1]), name: str(r[2]), parent: str(r[3]) || null }));
  const wIds = new Set(NP.wbs.map(w => w.id));
  NP.wbs.forEach(w => { if (w.parent && !wIds.has(w.parent)) errs.push(`WBS ${w.id}: parent ${w.parent} not found`); });
  if (new Set(NP.wbs.map(w => w.id)).size !== NP.wbs.length) errs.push('WBS: duplicate WBS ID');
  // CALENDAR
  const CG = G('CALENDAR'); const DN = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const work = DN.map(d => { const r = CG.find(r => r && str(r[0]).toLowerCase() === d); return r ? /^y/i.test(str(r[1])) : false; });
  if (!work.some(Boolean)) errs.push('CALENDAR: no working day');
  const hi = CG.findIndex(r => r && str(r[0]) === 'Holiday date'); const holidays = [];
  if (hi >= 0) CG.slice(hi + 1).forEach((r, i) => { if (!r || r[0] === null || r[0] === '') return; const d = date(r[0], `CALENDAR row ${hi + 2 + i}`); if (d) holidays.push({ d, n: str(r[1]) || 'Holiday' }); });
  const cn = CG.find(r => r && str(r[0]) === 'Calendar name');
  NP.calendar = { name: cn ? str(cn[1]) : P.calendar.name, work, holidays };
  // ACTIVITIES
  const A = tbl('ACTIVITIES', 'Activity ID'); const k = name => { const i = A.col(name); if (i < 0) throw new Error(`Column "${name}" not found in ACTIVITIES`); return i; };
  const c = { id: k('Activity ID'), wbs: k('WBS ID'), name: k('Activity name'), type: k('Type'), boq: k('BOQ codes'), od: k('Original dur (d)'), pct: k('% complete'), as: k('Actual start'), af: k('Actual finish'), rd: k('Remaining dur (d)'), pr: k('Predecessors'), ct: k('Constraint'), cd: k('Constraint date'), w: k('Weight'), v: k('Contract value (THB)'), nt: k('Notes'), trk: A.col('Tracker link (do not edit)') };
  const seen = new Set(); const predTxt = new Map(); NP.activities = [];
  A.rows.forEach(({ r, row }, i) => {
    const id = str(r[c.id]); const at = `ACTIVITIES row ${row}`;
    if (!id) { errs.push(`${at}: Activity ID is empty`); return; }
    if (seen.has(id)) { errs.push(`${at}: duplicate Activity ID ${id}`); return; } seen.add(id);
    const wbs = str(r[c.wbs]); if (!wIds.has(wbs)) errs.push(`${at} (${id}): WBS ID "${wbs}" not in WBS sheet`);
    const type = TXT_TYPE[str(r[c.type]).toLowerCase()] || (str(r[c.type]) ? (errs.push(`${at} (${id}): Type "${r[c.type]}" – use Task, Start milestone or Finish milestone`), 'TT_Task') : 'TT_Task');
    let pct = num(r[c.pct], `${at} % complete`); if (pct > 1.0001) pct /= 100; if (pct < 0 || pct > 1.0001) errs.push(`${at} (${id}): % complete must be 0–100%`); pct = Math.max(0, Math.min(1, Math.round(pct * 1e6) / 1e6));
    const as_ = date(r[c.as], `${at} (${id}) Actual start`), af = date(r[c.af], `${at} (${id}) Actual finish`);
    const mile = type !== 'TT_Task';
    let od = mile ? 0 : Math.round(num(r[c.od], `${at} Original dur`)), rdv = r[c.rd];
    let rd = mile ? 0 : (rdv === null || rdv === '' ? null : Math.round(num(rdv, `${at} Remaining dur`)));
    const a = { id, name: str(r[c.name]) || id, wbs, type, od, rd, pct, as_, af, cons: null, value: num(r[c.v], `${at} Contract value`), weight: (() => { let w = num(r[c.w], `${at} Weight`); return w > 1.0001 ? w / 100 : w; })(), boq: str(r[c.boq]), notes: str(r[c.nt]), seq: i };
    const tk = c.trk >= 0 ? str(r[c.trk]) : ''; if (tk === 'none') a.trk = false; else if (tk) { try { a.trk = JSON.parse(tk); } catch (e) { warn.push(`${id}: tracker link unreadable – ignored`); } }
    const ct = str(r[c.ct]).toUpperCase(); if (ct) { if (!CONS_CODES.includes(ct)) errs.push(`${at} (${id}): constraint "${ct}" – use SNET, FNLT, SNLT or FNET`); else { const cd = date(r[c.cd], `${at} (${id}) Constraint date`); if (!cd) errs.push(`${at} (${id}): constraint ${ct} needs a date`); else a.cons = [ct, cd]; } }
    // progress rules
    if (a.as_ && status && a.as_ > status) errs.push(`${at} (${id}): actual start ${fmtD(a.as_)} is after the status date`);
    if (a.af && status && a.af > status) errs.push(`${at} (${id}): actual finish ${fmtD(a.af)} is after the status date`);
    if (a.as_ && a.af && a.af < a.as_) errs.push(`${at} (${id}): actual finish before actual start`);
    if (mile) {
      if (type === 'TT_Mile') { a.af = null; a.pct = a.as_ ? 1 : 0; } else { if (a.af) a.as_ = null; a.pct = a.af ? 1 : 0; }
    } else {
      if (a.af && !a.as_) errs.push(`${at} (${id}): actual finish without actual start`);
      if (a.af) { if (pct < 1) warn.push(`${id}: actual finish given – % set to 100`); a.pct = 1; a.rd = 0; }
      else if (pct >= 1) { a.af = status; warn.push(`${id}: 100% without actual finish – finish set to status date ${fmtD(status)}`); if (!a.as_) a.as_ = status; a.rd = 0; }
      if (pct > 0 && !a.as_) { a.as_ = status; warn.push(`${id}: progress without actual start – start set to status date ${fmtD(status)}`); }
      if (a.rd === null) { a.rd = a.as_ ? Math.max(1, Math.round(od * (1 - a.pct))) : od; if (a.as_ && !a.af) warn.push(`${id}: remaining duration blank – estimated ${a.rd} d`); }
      if (od <= 0) errs.push(`${at} (${id}): original duration must be > 0 for a task`);
    }
    predTxt.set(id, { txt: str(r[c.pr]), at });
    NP.activities.push(a);
  });
  // relationships
  NP.rels = [];
  predTxt.forEach(({ txt, at }, id) => {
    if (!txt) return;
    txt.split(/[,;\s]+/).filter(Boolean).forEach(t => {
      const m = t.match(/^(.+?)(FS|SS|FF|SF)?([+-]\d+)?$/i);
      if (!m) { errs.push(`${at} (${id}): predecessor "${t}" not readable`); return; }
      if (!seen.has(m[1])) { errs.push(`${at} (${id}): predecessor ${m[1]} does not exist`); return; }
      if (m[1] === id) { errs.push(`${at} (${id}): an activity cannot be its own predecessor`); return; }
      NP.rels.push({ pred: m[1], succ: id, type: (m[2] || 'FS').toUpperCase(), lag: m[3] ? +m[3] : 0 });
    });
  });
  // resources & assignments
  const RS = tbl('RESOURCES', 'Resource ID'); NP.resources = RS.rows.map(({ r, row }) => ({ id: str(r[0]), name: str(r[1]) || str(r[0]), type: /non/i.test(str(r[2])) ? 'Nonlabor' : 'Labor', max: num(r[3], `RESOURCES row ${row} max`, 0), rate: num(r[4], `RESOURCES row ${row} rate`, 0) })).filter(x => x.id);
  const rIds = new Set(NP.resources.map(r => r.id));
  const AS = tbl('ASSIGNMENTS', 'Activity ID'); NP.assigns = [];
  AS.rows.forEach(({ r, row }) => { const a = str(r[0]), x = str(r[1]); if (!seen.has(a)) { warn.push(`ASSIGNMENTS row ${row}: activity ${a} not found – skipped`); return; } if (!rIds.has(x)) { warn.push(`ASSIGNMENTS row ${row}: resource ${x} not found – skipped`); return; } NP.assigns.push({ act: a, res: x, units: num(r[2], `ASSIGNMENTS row ${row} units`, 1) }); });

  const bmap = new Map(NP.baselines.map(b => [b.id, b]));
  const BD = tbl('BL_DATES', 'Baseline ID'); BD.rows.forEach(({ r, row }) => { const b = bmap.get(str(r[0])); if (!b) return; const s = date(r[2], `BL_DATES row ${row}`), f = date(r[3], `BL_DATES row ${row}`); if (s || f) b.dates[str(r[1])] = [s || f, f || s]; });
  if (wb.Sheets['DAILY']) {
    const DY = tbl('DAILY', 'Date'); NP.daily = {};
    DY.rows.forEach(({ r, row }) => { const d = date(r[0], `DAILY row ${row}`), id = str(r[1]); let v = num(r[2], `DAILY row ${row}`, 0); if (v > 1.0001) v /= 100; if (!d || !v) return; if (!seen.has(id)) { warn.push(`DAILY row ${row}: activity ${id} not found – skipped`); return; } if (status && d > status) { warn.push(`DAILY row ${row}: ${fmtD(d)} is after the status date – skipped`); return; } (NP.daily[id] = NP.daily[id] || {})[d] = (NP.daily[id][d] || 0) + v; });
  } else { NP.daily = P.daily || {}; }
  // commitments
  if (wb.Sheets['COMMIT']) {
    const CT = tbl('COMMIT', 'ID'), SM = { done: 'done', partial: 'part', missed: 'miss' }; NP.commit = [];
    CT.rows.forEach(({ r, row }) => { const id = str(r[0]) || `C${row}`, act = str(r[2]); if (!str(r[3])) return; if (act && !seen.has(act)) warn.push(`COMMIT row ${row}: activity ${act} not found`); const s0 = date(r[4], `COMMIT row ${row} start`), f0 = date(r[5], `COMMIT row ${row} finish`); if (!s0 && !f0) { errs.push(`COMMIT row ${row}: start or finish date needed`); return; } let p = r[6] === '' || r[6] === null ? null : num(r[6], `COMMIT row ${row} est. %`, 0); if (p > 1.0001) p /= 100;
      NP.commit.push({ id, who: str(r[1]) || 'Sub', act, txt: str(r[3]), s: s0 || f0, f: f0 || s0, pct: p || null, st: SM[str(r[7]).toLowerCase()] || '', note: str(r[8]), src: str(r[9]) }); });
  } else NP.commit = P.commit || [];

  if (wb.Sheets['RPT_PLAN'] && wb.Sheets['RPT_WEIGHT']) {
    const g = G('RPT_PLAN'), h = g.findIndex((r, i) => i < 15 && r && r[0] === 'Key'); const hdr = g[h];
    const months = hdr.slice(3).map(v => str(v)).filter(Boolean); const rows = g.slice(h + 1).filter(r => r && str(r[0]));
    const fc = r => months.map((_, c) => num(r[3 + c], 'RPT_PLAN', 0));
    const civ = rows.find(r => str(r[0]).toUpperCase() === 'CIVIL');
    const RW = tbl('RPT_WEIGHT', 'BOQ item'), w = {}; RW.rows.forEach(({ r, row }) => { if (str(r[0])) w[str(r[0])] = num(r[1], `RPT_WEIGHT row ${row}`, 0); });
    const notes = {};
    if (wb.Sheets['DAY_NOTES']) { const DN2 = tbl('DAY_NOTES', 'Date'), gh = G('DAY_NOTES')[DN2.hdrRow - 1]; DN2.rows.forEach(({ r, row }) => { const d = date(r[0], `DAY_NOTES row ${row}`); if (!d) return; const N = { wx: str(r[1]) }; for (let c = 2; c < gh.length; c++) { const k = str(gh[c]); if (!k) continue; const L = str(r[c]).split(/\r?\n/).map(x => x.trim()).filter(Boolean); if (L.length) N[k] = L; } notes[d] = N; }); }

// ---------- editing ----------
function applyEdit(a, key, val) {
  val = String(val).trim();
  const num = v => { const n = Number(String(v).replace(/,/g, '')); return isNaN(n) ? null : n; };
  const ddPrev = R.cal.fd(R.dd);  // last working day before data date
  switch (key) {
    case 'id': {
      if (!val) return 'Activity ID cannot be blank';
      if (val !== a.id && actById(val)) return `Activity ID ${val} already exists`;
      const old = a.id; a.id = val;
      P.rels.forEach(r => { if (r.pred === old) r.pred = val; if (r.succ === old) r.succ = val; });
      P.assigns.forEach(x => { if (x.act === old) x.act = val; });
      P.baselines.forEach(b => { if (b.dates[old]) { b.dates[val] = b.dates[old]; delete b.dates[old]; } });
      if (sel === old) sel = val; return;
    }
    case 'name': if (!val) return 'Name cannot be blank'; a.name = val; return;
    case 'boq': a.boq = val; if (a.trk && !a.trk.s && !a.trk.g) delete a.trk; return;
    case 'notes': a.notes = val; return;
    case 'od': { if (isMile(a)) return 'Milestones have zero duration'; const n = num(val); if (n === null || n < 0) return 'Enter a duration in working days'; a.od = Math.round(n); if (!a.as_) a.rd = a.od; return; }
    case 'rd': { if (isMile(a)) return 'Milestones have zero duration'; if (isDone(a)) return 'Activity is complete – clear Actual Finish first'; const n = num(val); if (n === null || n < 0) return 'Enter a duration in working days'; a.rd = Math.round(n); if (!a.as_) a.od = a.rd; return; }
    case 'pct': {
      let n = num(String(val).replace('%', '')); if (n === null || n < 0 || n > 100) return '% complete must be 0–100'; n = n / 100;
      if (isMile(a)) {
        if (n >= 1) { a.pct = 1; if (a.type === 'TT_Mile') a.as_ = a.as_ || ddPrev; else a.af = a.af || ddPrev; toast(`Actual date set to ${fmtD(ddPrev)} – edit if different`); }
        else { a.pct = 0; a.as_ = null; a.af = null; } return;
      }
      a.pct = n;
      if (n === 0) { a.as_ = null; a.af = null; a.rd = a.od; return; }
      if (!a.as_) { a.as_ = ddPrev; toast(`Actual start set to ${fmtD(ddPrev)} – edit if different`); }
      if (n >= 1) { a.af = a.af || ddPrev; a.rd = 0; }
      else { a.af = null; a.rd = Math.max(1, Math.round((+a.od || 1) * (1 - n))); }
      return;
    }
    case 'as': {
      if (!val) { if (a.af) return 'Clear Actual Finish first'; a.as_ = null; a.pct = 0; a.rd = a.od; return; }
      const d = parseDate(val); if (!d) return 'Date not recognised – use dd-Mmm-yy, e.g. 19-Oct-26';
      if (d >= P.dataDate) return `Actual start must be before the data date (${fmtD(P.dataDate)})`;
      if (a.af && d > a.af) return 'Actual start is after actual finish';
      a.as_ = d; if (isMile(a)) a.pct = 1; else if (!a.pct) a.pct = 0; return;
    }
    case 'af': {
      if (!val) { a.af = null; if (a.type === 'TT_FinMile') a.pct = 0; else { a.pct = Math.min(a.pct, 0.95); a.rd = Math.max(1, Math.round((+a.od || 1) * (1 - a.pct))); } return; }
      const d = parseDate(val); if (!d) return 'Date not recognised – use dd-Mmm-yy, e.g. 19-Oct-26';
      if (d >= P.dataDate) return `Actual finish must be before the data date (${fmtD(P.dataDate)})`;
      if (a.type === 'TT_FinMile') { a.af = d; a.pct = 1; return; }
      if (!a.as_) a.as_ = d; if (d < a.as_) return 'Actual finish is before actual start';
      a.af = d; a.pct = 1; a.rd = 0; return;
    }
    case 'preds': {
      const toks = val ? val.split(/[,;\s]+/).filter(Boolean) : [], nr = [];
      for (const t of toks) {
        const m = t.match(/^(.+?)(FS|SS|FF|SF)?([+-]\d+)?$/i); if (!m) return `Cannot read "${t}"`;
        const pid = m[1]; if (!actById(pid)) return `No activity with ID ${pid}`; if (pid === a.id) return 'An activity cannot be its own predecessor';
        nr.push({ pred: pid, succ: a.id, type: (m[2] || 'FS').toUpperCase(), lag: m[3] ? +m[3] : 0 });
      }
      P.rels = P.rels.filter(r => r.succ !== a.id).concat(nr); return;
    }
    case 'value': { const n = num(val); if (n === null) return 'Enter a number'; a.value = n * 1e6; return; }
    case 'weight': { const n = num(val); if (n === null) return 'Enter a number'; a.weight = n / 100 / wScale(); return; }
  }
  return 'This column is calculated';
}
function edit(a, key, val, label) {
  const before = JSON.stringify(P, strip); const err = applyEdit(a, key, val);
  if (err) { P = JSON.parse(before); toast(err, 3800); recalc(); return false; }
  markDirty(); undoStack.push({ s: before, label: label || `edit ${key} of ${a.id}` }); if (undoStack.length > 60) undoStack.shift();
  recalc(); return true;
}
function startCellEdit(td, a, c) {
  if (!canEdit()) return;
  if (!c.edit) { toast(`${lab(c)} is calculated – edit the inputs instead`); return; }
  const cur = c.raw ? c.raw(a) : c.get(a);
  td.classList.add('edit'); td.innerHTML = `<input value="${esc(cur)}" aria-label="${esc(lab(c))}">`;
  const inp = td.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const finish = ok => { if (done) return; done = true; if (ok && inp.value !== String(cur)) edit(a, c.k, inp.value); else renderAll(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') finish(false); e.stopPropagation(); });
  inp.addEventListener('blur', () => finish(true));
}

// ---------- add / delete ----------
function nextId(base) {
  const m = String(base || 'A1000').match(/^(.*?)(\d+)$/); const pre = m ? m[1] : 'A'; let n = m ? +m[2] + 10 : 1000;
  while (actById(pre + n)) n++; return pre + n;
}
function addActivity() {
  if (!canEdit()) return;
  pushUndo('add activity');
  let wbs = 'W1', after = null;
  if (selKind === 'act' && actById(sel)) { after = actById(sel); wbs = after.wbs; } else if (selKind === 'wbs' && sel) wbs = sel;
  const sameW = P.activities.filter(a => a.wbs === wbs).sort((a, b) => a.seq - b.seq);
  const ref = after || sameW[sameW.length - 1];
  const a = { id: nextId(ref ? ref.id : 'A9000'), name: 'New activity', wbs, type: 'TT_Task', od: 5, rd: 5, pct: 0, as_: null, af: null, cons: null, value: 0, weight: 0, boq: '', notes: '', seq: ref ? ref.seq + 0.5 : P.activities.length };
  P.activities.push(a); P.activities.sort((x, y) => x.seq - y.seq).forEach((x, i) => x.seq = i);
  UI.collapsed[wbs] = false; sel = a.id; selKind = 'act';
  recalc(); toast(`Added ${a.id}. Double-click a cell to edit; set predecessors to tie it into the logic.`);
  const tr = [...document.querySelectorAll('#grid tbody tr')].find(t => ROWS[+t.dataset.i]?.a?.id === a.id); tr?.scrollIntoView({ block: 'nearest' });
}
function deleteActivity() {
  if (!canEdit()) return;
  if (selKind !== 'act' || !actById(sel)) { toast('Select an activity to delete'); return; }
  pushUndo('delete ' + sel); const id = sel;
  const idx = ROWS.findIndex(r => r.kind === 'act' && r.a.id === id);
  P.activities = P.activities.filter(a => a.id !== id); P.rels = P.rels.filter(r => r.pred !== id && r.succ !== id); P.assigns = P.assigns.filter(x => x.act !== id);
  const nxt = ROWS.slice(idx + 1).find(r => r.kind === 'act') || ROWS.slice(0, idx).reverse().find(r => r.kind === 'act');
  sel = nxt ? nxt.a.id : null; recalc(); toast(`Deleted ${id} – Ctrl+Z to undo`);
}

// resource loading
function loadProfile(resId) {
  const day = new Map(), cal = R.cal;
  P.assigns.filter(x => x.res === resId || (resId === '*LAB' && P.resources.find(r => r.id === x.res)?.type === 'Labor')).forEach(x => {
    const a = actById(x.act); if (!a || isMile(a) || !inScope(a)) return; const t = a._;
    const add = (s, e) => { for (let i = s; i < e; i++) day.set(i, (day.get(i) || 0) + x.units); };
    if (t.done) add(cal.s(a.as_), cal.f(a.af));
    else if (a.as_) { add(cal.s(a.as_), R.dd); add(t.rs, t.ef); }
    else add(t.es, t.ef);
  });
  return day;
}

  $('#resPane').innerHTML = `<div class="card"><h2>Resource usage profile</h2>

function loadJson(txt) {
